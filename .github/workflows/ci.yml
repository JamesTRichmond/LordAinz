name: Static Site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify launch-critical files exist
        run: |
          required_files=(
            index.html
            styles.css
            throne.js
            reliquary.js
            README.md
            CNAME
            404.html
            robots.txt
            sitemap.xml
            site.webmanifest
            favicon.svg
            og.png
            icon-192.png
            icon-512.png
            apple-touch-icon.png
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          echo "Launch-critical files found."

      - name: Basic HTML sanity check
        run: |
          grep -q "<!doctype html\|<!DOCTYPE html" index.html
          grep -q "<title>" index.html
          grep -q "<script src=\"throne.js\" defer></script>" index.html
          grep -q "<script src=\"reliquary.js\" defer></script>" index.html
          echo "Basic HTML checks passed."

      - name: Validate static metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))
          ET.parse("sitemap.xml")

          cname = Path("CNAME").read_text(encoding="utf-8").strip()
          if cname != "lordai.nz":
              raise SystemExit(f"Unexpected CNAME: {cname!r}")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://lordai.nz/sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not reference the canonical sitemap")

          html = Path("index.html").read_text(encoding="utf-8")
          for ref in [
              "https://lordai.nz/",
              "https://lordai.nz/og.png",
              "favicon.svg",
              "icon-192.png",
              "icon-512.png",
              "apple-touch-icon.png",
              "site.webmanifest",
              "styles.css",
              "throne.js",
              "reliquary.js",
          ]:
              if ref not in html:
                  raise SystemExit(f"index.html is missing expected reference: {ref}")

          # og.png must be 1200x630 for social cards
          try:
              from PIL import Image
          except Exception as e:
              raise SystemExit(f"PIL not available: {e}")
          img = Image.open("og.png")
          if img.size != (1200, 630):
              raise SystemExit(f"og.png must be 1200x630, got {img.width}x{img.height}")

          # sitemap lastmod must exist and be within the last 90 days
          tree = ET.parse("sitemap.xml")
          lastmod_text = tree.findtext(".//{http://www.sitemaps.org/schemas/sitemap/0.9}lastmod")
          if not lastmod_text:
              raise SystemExit("sitemap.xml is missing <lastmod>")
          lastmod = datetime.fromisoformat(lastmod_text).replace(tzinfo=timezone.utc)
          age_days = (datetime.now(timezone.utc) - lastmod).days
          if age_days > 90:
              raise SystemExit(f"sitemap.xml lastmod is {age_days} days old (> 90)")

          print("Static metadata checks passed.")
          PY

      - name: Validate HTML (W3C Nu)
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/validator/validator:latest vnu --skip-non-html --errors-only /work

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: |
            index.html
            styles.css
            throne.js
            reliquary.js
            README.md
            CNAME
            404.html
            robots.txt
            sitemap.xml
            site.webmanifest
            favicon.svg
            og.png
            icon-192.png
            icon-512.png
            apple-touch-icon.png
          if-no-files-found: error
